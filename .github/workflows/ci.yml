name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install chezmoi (Unix)
        if: runner.os != 'Windows'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          os="$(uname -s | tr '[:upper:]' '[:lower:]')"
          arch="$(uname -m)"
          case "$arch" in
            x86_64) arch="amd64" ;;
            arm64|aarch64) arch="arm64" ;;
          esac
          mkdir -p "$HOME/.local/bin" /tmp/chezmoi-dl
          gh release download --repo twpayne/chezmoi --pattern "*_${os}_${arch}.tar.gz" -D /tmp/chezmoi-dl
          tar -xzf /tmp/chezmoi-dl/*_"${os}_${arch}".tar.gz -C /tmp/chezmoi-dl chezmoi
          install -m 755 /tmp/chezmoi-dl/chezmoi "$HOME/.local/bin/chezmoi"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install chezmoi (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $dlDir = Join-Path $env:RUNNER_TEMP 'chezmoi-dl'
          $binDir = Join-Path $env:RUNNER_TEMP 'chezmoi-bin'
          New-Item -ItemType Directory -Force -Path $dlDir, $binDir | Out-Null
          gh release download --repo twpayne/chezmoi --pattern '*_windows_amd64.zip' -D $dlDir
          $zip = Get-ChildItem -Path $dlDir -Filter '*_windows_amd64.zip' | Select-Object -First 1
          Expand-Archive -Path $zip.FullName -DestinationPath $binDir -Force
          $binDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Verify tools
        run: |
          chezmoi --version
          python --version

      - name: Run chezmoi test suite
        run: python tests/test_chezmoi.py
